    function drawChar(ch, x, y, color) {
        var glyph = FONT[ch];
        if (!glyph) return;
        ctx.fillStyle = color;
        for (var row = 0; row < 8; row++) {
            var bits = glyph[row];
            for (var col = 0; col < 8; col++) {
                if (bits & (1 << (7 - col))) {
                    ctx.fillRect(x + col, y + row, 1, 1);
                }
            }
        }
    }

    function drawText(text, x, y, color) {
        var c = color || C.FOAM_WHITE;
        var str = String(text).toUpperCase();
        for (var i = 0; i < str.length; i++) {
            drawChar(str[i], x + i * 8, y, c);
        }
    }

    function drawTextCenter(text, y, color) {
        var str = String(text).toUpperCase();
        var w = str.length * 8;
        drawText(str, Math.round((W - w) / 2), y, color || C.FOAM_WHITE);
    }

    function drawTextLarge(text, y, color) {
        var c = color || C.FOAM_WHITE;
        var str = String(text).toUpperCase();
        var totalW = str.length * 16;
        var startX = Math.round((W - totalW) / 2);
        ctx.fillStyle = c;
        for (var i = 0; i < str.length; i++) {
            var glyph = FONT[str[i]];
            if (!glyph) continue;
            var cx = startX + i * 16;
            for (var row = 0; row < 8; row++) {
                var bits = glyph[row];
                for (var col = 0; col < 8; col++) {
                    if (bits & (1 << (7 - col))) {
                        ctx.fillRect(cx + col * 2, y + row * 2, 2, 2);
                    }
                }
            }
        }
    }

    function renderHUD() {
        drawText('SCORE:' + state.score, 2, 2, C.FOAM_WHITE);
        // Lantern lives: show 3 slots, lit for remaining, unlit for lost
        var maxLives = 3;
        var lanternSize = 8; // game units width
        var lanternH = 10; // game units height
        var lanternGap = 10;
        var livesX = Math.round(W / 2 - (maxLives * lanternGap) / 2);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        for (var i = 0; i < maxLives; i++) {
            var img = (i < state.lives) ? assets.lanternLit : assets.lanternUnlit;
            if (img) {
                ctx.drawImage(img, livesX + i * lanternGap, 0, lanternSize, lanternH);
            } else {
                // Fallback to procedural icon
                ctx.drawImage(sprites.lifeIcon, livesX + i * lanternGap, 1);
            }
        }
        ctx.imageSmoothingEnabled = false;
        var waveStr = 'WAVE:' + state.wave;
        drawText(waveStr, W - waveStr.length * 8 - 2, 2, C.FOAM_WHITE);
    }

    // ============================================================
    // 13. Canvas Scaling
    // ============================================================
    function resize() {
        var maxW = window.innerWidth;
        var maxH = window.innerHeight;
        var isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0 || maxW <= 900;
        var controlsEl = document.getElementById('touch-controls');
        var creditsEl = document.getElementById('credits');
        var tipJarEl = document.querySelector('.tip-jar-section');
        var controlsH = 0;
        var footerH = 0;

        if (isMobile && controlsEl) {
            controlsEl.style.display = 'block';
            controlsH = controlsEl.offsetHeight || 90;
        } else if (controlsEl) {
            controlsEl.style.display = 'none';
        }
        if (creditsEl) footerH += creditsEl.offsetHeight || 0;
        if (tipJarEl) footerH += tipJarEl.offsetHeight || 0;

        var availH = maxH - controlsH - footerH;
        if (isMobile) {
            // Full-width scaling on mobile (non-integer for best fit)
            var scale = Math.min(maxW / W, availH / H);
            canvas.style.width = Math.floor(W * scale) + 'px';
            canvas.style.height = Math.floor(H * scale) + 'px';
        } else {
            // Integer scaling on desktop
            var scale = Math.max(1, Math.floor(Math.min(maxW / W, availH / H)));
            canvas.style.width = (W * scale) + 'px';
            canvas.style.height = (H * scale) + 'px';
        }
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();

        if (boss.active) {

            ctx.strokeRect(boss.x + BOSS.weakHb.x, boss.y + BOSS.weakHb.y, BOSS.weakHb.w, BOSS.weakHb.h);
        }

        // Dock path visualization
        ctx.lineWidth = 1;
        // Left dock path
        ctx.strokeStyle = '#00ff00';
        ctx.beginPath();
        ctx.moveTo(STALKER_PATHS.left.startX, STALKER_PATHS.left.startY);

        drawText(STALKER_PATHS.left.endX + ',' + STALKER_PATHS.left.endY, STALKER_PATHS.left.endX + 2, STALKER_PATHS.left.endY - 4, '#00ff00');

        // Right dock path

        ctx.moveTo(STALKER_PATHS.right.startX, STALKER_PATHS.right.startY);
        ctx.lineTo(STALKER_PATHS.right.endX, STALKER_PATHS.right.endY);

        // Stalker positions
        for (const e of enemies) {
            if (!e.alive || e.type !== 'stalker') continue;
            drawText(Math.round(e.x) + ',' + Math.round(e.y), e.x, e.y - 6, '#ffffff');
        }

        // Mouse coordinate tracker
        drawText('MOUSE: ' + debugMouse.x + ',' + debugMouse.y, 2, 32, '#00ffff');
        if (state.debugPaused) {
            drawText('PAUSED (P to resume)', 80, 32, '#ff0000');
        }
        // Crosshair at mouse position
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(debugMouse.x - 4, debugMouse.y);
        ctx.lineTo(debugMouse.x + 4, debugMouse.y);
        ctx.moveTo(debugMouse.x, debugMouse.y - 4);
        ctx.lineTo(debugMouse.x, debugMouse.y + 4);
        ctx.stroke();
    }

            enemies.length = 0; waveState.spawning = false; waveState.spawnQueue.length = 0;
            keys['KeyN'] = false;

    function createTouchControls() {
        var container = document.createElement('div');
        container.id = 'touch-controls';
        var inner = document.createElement('div');
        inner.className = 'tc-inner';

        // Left/Right buttons
        var moveBtns = document.createElement('div');
        moveBtns.className = 'tc-move-btns';

        function createMoveBtn(dir) {
            var btn = document.createElement('div');
            btn.className = 'tc-move-btn';
            // Rivets
            var r1 = document.createElement('div'); r1.className = 'rivet r-tl';
            var r2 = document.createElement('div'); r2.className = 'rivet r-tr';
            var r3 = document.createElement('div'); r3.className = 'rivet r-bl';
            var r4 = document.createElement('div'); r4.className = 'rivet r-br';
            btn.appendChild(r1); btn.appendChild(r2); btn.appendChild(r3); btn.appendChild(r4);
            // Arrow with bar
            var arrowInner = document.createElement('div');
            arrowInner.className = 'tc-arrow-inner';
            var arrow = document.createElement('div');
            arrow.className = 'tc-arrow tc-arrow-' + dir;
            var bar = document.createElement('div');
            bar.className = 'tc-arrow-bar';
            if (dir === 'left') {
                arrowInner.appendChild(arrow);
                arrowInner.appendChild(bar);
            } else {
                arrowInner.appendChild(bar);
                arrowInner.appendChild(arrow);
            }
            btn.appendChild(arrowInner);
            return btn;
        }

        var btnL = createMoveBtn('left');
        var btnR = createMoveBtn('right');
        moveBtns.appendChild(btnL);
        moveBtns.appendChild(btnR);

        // Fire button with brass plate
        var fireWrap = document.createElement('div');
        fireWrap.id = 'touch-fire-wrap';
        var rTL = document.createElement('div'); rTL.className = 'rivet rivet-tl';
        var rTR = document.createElement('div'); rTR.className = 'rivet rivet-tr';
        var rBL = document.createElement('div'); rBL.className = 'rivet rivet-bl';
        var rBR = document.createElement('div'); rBR.className = 'rivet rivet-br';
        fireWrap.appendChild(rTL); fireWrap.appendChild(rTR);
        fireWrap.appendChild(rBL); fireWrap.appendChild(rBR);
        var fireRing = document.createElement('div');
        fireRing.id = 'touch-fire-ring';
        var fireBtn = document.createElement('div');
        fireBtn.id = 'touch-fire-btn';
        fireBtn.textContent = 'FIRE';
        fireRing.appendChild(fireBtn);
        fireWrap.appendChild(fireRing);

        inner.appendChild(moveBtns);
        inner.appendChild(fireWrap);
        container.appendChild(inner);
        document.body.insertBefore(container, document.getElementById('credits'));

        // Movement button touch handlers with ID tracking
        function bindMove(el, key, cls) {
            var touchId = null;
            el.addEventListener('touchstart', function(e) {
                e.preventDefault();
                touchId = e.changedTouches[0].identifier;
                keys[key] = true;
                lastInputSource = 'touch';
                el.classList.add('active');
            });
            el.addEventListener('touchend', function(e) {
                e.preventDefault();
                for (var i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        keys[key] = false;
                        el.classList.remove('active');
                        touchId = null;
                        break;
                    }
                }
            });
            el.addEventListener('touchcancel', function(e) {
                for (var i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        keys[key] = false;
                        el.classList.remove('active');
                        touchId = null;
                        break;
                    }
                }
            });
        }
        bindMove(btnL, 'ArrowLeft');
        bindMove(btnR, 'ArrowRight');

        // Fire button with touch ID tracking
        var fireTouchId = null;
        fireWrap.addEventListener('touchstart', function(e) {
            e.preventDefault();
            fireTouchId = e.changedTouches[0].identifier;
            keys['Space'] = true;
            firePressed = true;
            lastInputSource = 'touch';
            fireBtn.classList.add('active');
        });
        fireWrap.addEventListener('touchend', function(e) {
            e.preventDefault();
            for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === fireTouchId) {
                    keys['Space'] = false;
                    keys._fireHeld = false;
                    fireBtn.classList.remove('active');
                    fireTouchId = null;
                    break;
                }
            }
        });
        fireWrap.addEventListener('touchcancel', function(e) {
            for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === fireTouchId) {
                    keys['Space'] = false;
                    keys._fireHeld = false;
                    fireBtn.classList.remove('active');
                    fireTouchId = null;
                    break;
                }
            }
        });
    }

    function renderWharves() {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        if (assets.dockLeft) {
            // Left dock image: positioned at left edge, covering the dock zone
            // Image is 160×120, draw it to cover from x=0 to ~40, y=130 to y=190 in game coords
            var lw = 80; // game-coord width (doubled)
            var lh = lw * (assets.dockLeft.height / assets.dockLeft.width); // maintain aspect ratio
            var ly = WHARVES.left.bottomY - 2; // top aligns near inner (higher) dock edge
            ctx.drawImage(assets.dockLeft, 0, ly, lw, lh);
        } else {
            // Fallback: procedural left dock
            ctx.fillStyle = C.DARK_GRAY;
            ctx.beginPath();
            ctx.moveTo(0, WHARVES.left.topY);
            ctx.lineTo(WHARVES.left.w + 12, WHARVES.left.bottomY);
            ctx.lineTo(WHARVES.left.w + 10, WHARVES.left.bottomY + 6);
            ctx.lineTo(0, WHARVES.left.topY + 8);
            ctx.closePath();
            ctx.fill();
        }

        if (assets.dockRight) {
            // Right dock image: positioned at right edge
            var rw = 80;
            var rh = rw * (assets.dockRight.height / assets.dockRight.width);
            var ry = WHARVES.right.bottomY - 2;
            ctx.drawImage(assets.dockRight, W - rw, ry, rw, rh);
        } else {
            // Fallback: procedural right dock
            ctx.fillStyle = C.DARK_GRAY;
            var rTipX = W - WHARVES.right.w - 12;
            ctx.beginPath();
            ctx.moveTo(W, WHARVES.right.topY);
            ctx.lineTo(rTipX, WHARVES.right.bottomY);
            ctx.lineTo(rTipX + 2, WHARVES.right.bottomY + 6);
            ctx.lineTo(W, WHARVES.right.topY + 8);
            ctx.closePath();
            ctx.fill();
        }

        ctx.imageSmoothingEnabled = false;
    }

    // Handle start/restart input
    function handleStartInput() {

    // Debug mouse coordinate tracker

    canvas.addEventListener('click', function() {

            startAmbient();
            try { playGameStart(); } catch(e) {}
        } else if (state.mode === 'GAME_OVER') {
            resetGame();
            state.mode = 'WAVE_TRANSITION';
            state.stateTimer = TIMING.waveTransition;
            startAmbient();
        }
    });

    canvas.addEventListener('touchstart', function(e) {
        initAudio();
        lastInputSource = 'touch';
        if (state.mode === 'START_SCREEN') {
            state.mode = 'WAVE_TRANSITION';
            state.stateTimer = TIMING.waveTransition;
            startAmbient();
            try { playGameStart(); } catch(e) {}
            e.preventDefault();
        } else if (state.mode === 'GAME_OVER') {
            resetGame();
            state.mode = 'WAVE_TRANSITION';
            state.stateTimer = TIMING.waveTransition;
            startAmbient();
            e.preventDefault();
        }
    });

    function update(dt) {
        handleDebugKeys();

        // Debug pause — skip all game logic but still render
        if (state.debugPaused) return;

        // Consume fire input in non-gameplay states to prevent queuing
        if (state.mode !== 'PLAYING' && state.mode !== 'BOSS_FIGHT') {
            firePressed = false;
        }

        if (state.mode === 'START_SCREEN') {
            if (handleStartInput()) {
                initAudio();
                state.mode = 'WAVE_TRANSITION';
                state.stateTimer = TIMING.waveTransition;
                startAmbient();
                try { playGameStart(); } catch(e) {}
                for (const k in keys) keys[k] = false;
                firePressed = false;
            }
            return;
        }

        if (state.mode === 'PLAYING') {
            // Ensure music is playing (retry if initial attempt failed)
            if (musicCurrent !== 'main') playMusic('main');
            updatePlayer(dt);
            updatePlayerBullets(dt);
            updateEnemies(dt);
            updateEnemyBullets(dt);
            updateWaveSpawning(dt);
            updateDevilReef(dt);
            updateParticles(dt);
            updateVfx(dt);
            checkCollisions();
            checkWaveComplete();
            return;
        }

        if (state.mode === 'WAVE_TRANSITION') {
            // Play announcement sound on first frame of transition
            if (state.stateTimer >= TIMING.waveTransition - 1) {
                try { playWaveAnnounce(); } catch(e) {}
                // Clear all projectiles at start of transition
                enemyBullets = [];
                playerBullets = [];
            }
            // Retry music each frame until it's actually playing
            var wantedMusic = state._pendingBoss ? 'boss' : 'main';
            if (musicCurrent !== wantedMusic) {
                playMusic(wantedMusic);
            }
            state.stateTimer -= dt;
            updatePlayerBullets(dt);
            updateParticles(dt);
            updateVfx(dt);
            // Keep muzzle flash ticking so it doesn't freeze
            if (player.firingTimer > 0) {
                player.firingTimer -= dt;
                if (player.firingTimer <= 0) player.firing = false;
            }
            if (state.stateTimer <= 0) {
                if (state._pendingBoss) {
                    state._pendingBoss = false;
                    startBoss();
                } else {
                    state.mode = 'PLAYING';
                    startWave(state.wave);
                }
            }
            return;
        }

        if (state.mode === 'BOSS_FIGHT') {
            // Ensure boss music is playing (retry if initial attempt failed)
            if (musicCurrent !== 'boss') playMusic('boss');
            updatePlayer(dt);
            updatePlayerBullets(dt);
            updateBoss(dt);
            updateEnemyBullets(dt);
            updateParticles(dt);
            updateVfx(dt);
            checkCollisions();
            return;
        }

        if (state.mode === 'DEATH_PAUSE') {
            if (!player.alive) {
                player.deathTimer += dt;
                // Sink player downward out of frame
                player.y += 1.5 * dt;
            }
            updatePlayerBullets(dt);
            updateParticles(dt);
            // Keep muzzle flash ticking so it doesn't freeze
            if (player.firingTimer > 0) {
                player.firingTimer -= dt;
                if (player.firingTimer <= 0) player.firing = false;
            }
            state.stateTimer -= dt;
            if (state.stateTimer <= 0) {
                if (state.lives <= 0) {
                    state.mode = 'GAME_OVER';
                    stopMusic();
                    try { playGameOver(); } catch(e) {}
                    if (state.score > state.highScore) { state.highScore = state.score; saveHighScore(state.highScore); }
                } else {
                    respawnPlayer();
                    // Return to correct mode
                    if (boss.active) state.mode = 'BOSS_FIGHT';
                }
            }
            return;
        }

        if (state.mode === 'GAME_OVER') {
            if (handleStartInput()) {
                resetGame();
                state.mode = 'WAVE_TRANSITION';
                state.stateTimer = TIMING.waveTransition;
                startAmbient();
                for (const k in keys) keys[k] = false;
                firePressed = false;
            }
            return;
        }
    }


    // ============================================================
    // 21. Full Rendering Pipeline — render()
    // ============================================================
    function render() {
        if (state.mode === 'START_SCREEN') {
            renderStartScreen();
            return;
        }
        if (state.mode === 'GAME_OVER') {
            renderGameOverScreen();
            return;
        }

        // Layer 1: Sky background
        ctx.fillStyle = C.DEEP_OCEAN;
        ctx.fillRect(0, 0, W, H);
        if (assets.sky) {
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(assets.sky, 0, 0, W, ZONES.SKY.h);
            ctx.imageSmoothingEnabled = false;

            // Drifting fog — rises from horizon upward and outward to corners
            var fogT = vfx.oceanPhase;
            var horizonY = ZONES.SKY.h; // fog originates from bottom of sky zone

            // Multiple fog wisps that rise from horizon center and drift toward upper corners
            for (var i = 0; i < 5; i++) {
                // Each wisp has a different phase offset and speed
                var phase = fogT * (0.25 + i * 0.06) + i * 1.3;
                var cycle = (phase % 4) / 4; // 0→1 repeating cycle

                // Start at horizon center, rise upward
                var startX = W * 0.5;
                var startY = horizonY;

                // Drift outward toward corners as it rises
                var spread = (i % 2 === 0 ? -1 : 1) * (0.3 + i * 0.12);
                var wx = startX + spread * W * cycle + Math.sin(phase * 0.5) * 15;
                var wy = startY - cycle * horizonY * 0.9;

                // Grow larger as it rises, fade out near top
                var wr = 20 + cycle * 45;
                var alpha = Math.sin(cycle * Math.PI) * 0.55; // more visible

                if (alpha > 0.01) {
                    // Stretch wisp horizontally for a wide, flat fog shape
                    ctx.save();
                    ctx.translate(wx, wy);
                    ctx.scale(3, 1); // 3x wider than tall
                    var fog = ctx.createRadialGradient(0, 0, 0, 0, 0, wr);
                    var a1 = Math.min(1, alpha).toFixed(3);
                    var a2 = Math.min(1, alpha * 0.4).toFixed(3);
                    fog.addColorStop(0, 'rgba(160,175,190,' + a1 + ')');
                    fog.addColorStop(0.5, 'rgba(140,155,170,' + a2 + ')');
                    fog.addColorStop(1, 'rgba(120,135,150,0)');
                    ctx.fillStyle = fog;
                    ctx.fillRect(-wr, -wr, wr * 2, wr * 2);
                    ctx.restore();
                }
            }

            // Subtle overall haze near horizon
            ctx.globalAlpha = 0.05 + Math.sin(fogT * 0.15) * 0.03;
            var hazeGrad = ctx.createLinearGradient(0, horizonY, 0, horizonY - 30);
            hazeGrad.addColorStop(0, '#5a6a7a');
            hazeGrad.addColorStop(1, 'rgba(90,100,110,0)');
            ctx.fillStyle = hazeGrad;
            ctx.fillRect(0, horizonY - 30, W, 30);
            ctx.globalAlpha = 1;
        } else {
            ctx.fillStyle = C.CLOUD_PURPLE;
            ctx.fillRect(0, 0, W, ZONES.SKY.h);
        }

        // Layer 2: Ocean background + wave animation
        renderOceanWaves();

        // Layer 2.5: Boss (behind Devil Reef, clipped to horizon)
        renderBoss();

        // Layer 3: Devil Reef (no horizon line — ocean meets sky naturally)
        renderDevilReef();

        // Layer 4: Shoreline
        if (assets.beach) {
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(assets.beach, 0, ZONES.SHORELINE.y, W, ZONES.SHORELINE.h);
            ctx.imageSmoothingEnabled = false;
        } else {
            ctx.fillStyle = C.DARK_GRAY;
            ctx.fillRect(0, ZONES.SHORELINE.y, W, ZONES.SHORELINE.h);
            ctx.fillStyle = C.PALE_GRAY;
            ctx.fillRect(0, ZONES.SHORELINE.y, W, 2);
        }

        // Lapping waves — rendered at display resolution
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        var RS = RENDER_SCALE;
        var dShoreY = ZONES.SHORELINE.y * RS;
        var dW = W * RS;
        var t = vfx.oceanPhase;

        var baseY = dShoreY - 30;

        // 4 crests straddling the seam, more opaque, independent movement
        var baseY = dShoreY - 30;

        for (var i = 0; i < 4; i++) {
            var lap = (Math.sin(t * 0.7 + i * 0.9) > 0 ? Math.sin(t * 0.7 + i * 0.9) : Math.sin(t * 0.7 + i * 0.9) * 0.2) * 12;
            var wy = baseY + i * 12 + lap;
            var wh = 50;

            var brightness = 120 + Math.round((1 - i / 4) * 35);
            var peakAlpha = 0.55 + (1 - i / 4) * 0.25;

            var g = ctx.createLinearGradient(0, wy, 0, wy + wh);
            g.addColorStop(0, 'rgba(' + brightness + ',' + (brightness + 8) + ',' + (brightness + 12) + ',0)');
            g.addColorStop(0.2, 'rgba(' + brightness + ',' + (brightness + 8) + ',' + (brightness + 12) + ',' + (peakAlpha * 0.5).toFixed(2) + ')');
            g.addColorStop(0.45, 'rgba(' + brightness + ',' + (brightness + 8) + ',' + (brightness + 12) + ',' + peakAlpha.toFixed(2) + ')');
            g.addColorStop(0.55, 'rgba(' + brightness + ',' + (brightness + 8) + ',' + (brightness + 12) + ',' + peakAlpha.toFixed(2) + ')');
            g.addColorStop(0.8, 'rgba(' + brightness + ',' + (brightness + 8) + ',' + (brightness + 12) + ',' + (peakAlpha * 0.5).toFixed(2) + ')');
            g.addColorStop(1, 'rgba(' + brightness + ',' + (brightness + 8) + ',' + (brightness + 12) + ',0)');
            ctx.fillStyle = g;

            ctx.beginPath();
            // Top edge: flat straight line
            ctx.moveTo(-10, wy);
            ctx.lineTo(dW + 10, wy);
            // Right side down
            ctx.lineTo(dW + 10, wy + wh);
            // Bottom edge: wavy (foam hitting the beach)
            for (var px = dW; px >= -10; px -= 20) {
                var wave = Math.sin(t * 0.45 + px * 0.006 + i * 0.8) * 8;
                var cpx = px - 10;
                var cpy = wy + wh + Math.sin(t * 0.55 + (px - 10) * 0.007 + i * 0.8) * 8;
                ctx.quadraticCurveTo(cpx, cpy, px - 20, wy + wh + Math.sin(t * 0.45 + (px - 20) * 0.006 + i * 0.8) * 8);
            }
            ctx.closePath();
            ctx.fill();
        }

        // Wet sand
        var wetGrad = ctx.createLinearGradient(0, dShoreY - 20, 0, dShoreY + 40);
        wetGrad.addColorStop(0, 'rgba(10,20,25,0.08)');
        wetGrad.addColorStop(1, 'rgba(10,20,25,0)');
        ctx.fillStyle = wetGrad;
        ctx.fillRect(0, dShoreY - 20, dW, 60);

        ctx.restore();

        // Layer 5: Enemies
        renderEnemies();

        // Layer 6: (boss now rendered earlier, behind reef)

        // Layer 7: Tentacle columns
        renderTentacles();

        // Layer 8: Enemy projectiles
        renderEnemyBullets();

        // Layer 11: Muzzle flash (handled in renderPlayer)

        // Layer 12: Particles
        renderParticles();

        // Layer 13: Wharf overlay
        renderWharves();

        // Layer 13a: Stalkers (on top of docks)
        renderStalkers();

        // Layer 13b: Player (in front of docks)
        renderPlayer();

        // Layer 13c: Player death particles (on top of sinking sprite)
        renderPlayerDeathParticles();

        // Layer 13b: Player projectiles (in front of docks)
        renderPlayerBullets();

        // Layer 14: Lightning flash
        renderLightning();

        // Layer 15: HUD
        renderHUD();

        // Wave transition overlay
        if (state.mode === 'WAVE_TRANSITION') {
            drawTextLarge('WAVE ' + state.wave, 95, C.GLOW_YELLOW);
        }

        // Death pause overlay
        if (state.mode === 'DEATH_PAUSE') {
            // Just show the scene with death animation (already rendered)
        }

        // Layer 16: Debug overlay
        renderDebug();
    }

    // ============================================================
    // 22. Game Loop
    // ============================================================
    function gameLoop(now) {
        state.dt = computeDt(now, state.lastTime);
        state.lastTime = now;
        update(state.dt);
        render();
        requestAnimationFrame(gameLoop);
    }

    // Initialize and start
    state.lastTime = performance.now();
    requestAnimationFrame(gameLoop);

    // ============================================================
    // 24. Test Exports
    // ============================================================
    window._test = window._test || {};
    window._test.computeDt = computeDt;

    // Utility functions
    window._test.aabbCollision = aabbCollision;
    window._test.getWaveParam = getWaveParam;
    window._test.getWaveConfig = getWaveConfig;
    window._test.computeScale = computeScale;
    window._test.clampSpawnPosition = clampSpawnPosition;
    window._test.getBossConfig = getBossConfig;
    window._test.getBossAttackType = getBossAttackType;
    window._test.resolveMovementInput = resolveMovementInput;
    window._test.canFire = canFire;
    window._test.clampBossX = clampBossX;
    window._test.placeTentacleColumns = placeTentacleColumns;
    window._test.loadHighScore = loadHighScore;
    window._test.saveHighScore = saveHighScore;

    // Sprite system
    window._test.createSprite = createSprite;
    window._test.sprites = sprites;

    // Input system
    window._test.keys = keys;
    window._test.consumeFireInput = consumeFireInput;

    // Player
    window._test.player = player;
    window._test.playerBullets = playerBullets;
    window._test.updatePlayerPosition = updatePlayerPosition;
    window._test.spawnPellet = spawnPellet;
    window._test.hitPlayer = hitPlayer;
    window._test.respawnPlayer = respawnPlayer;
    window._test.state = state;

    // Constants
    window._test.W = W;
    window._test.H = H;
    window._test.WAVE_TABLE = WAVE_TABLE;
    window._test.SCALING = SCALING;
    window._test.BOSS = BOSS;
    window._test.CAPS = CAPS;
    window._test.SPAWN = SPAWN;
    window._test.TENTACLE = TENTACLE;
    window._test.REEF = REEF;
    window._test.POINTS = POINTS;
    window._test.PLAYER = PLAYER;
    window._test.TIMING = TIMING;
    window._test.ENEMY_TYPES = ENEMY_TYPES;
    window._test.ENEMY_BULLET = ENEMY_BULLET;
    window._test.WHARVES = WHARVES;
    window._test.ZONES = ZONES;
    window._test.RANDOM = RANDOM;

    // Enemy system
    window._test.createEnemy = createEnemy;
    window._test.createEnemyBullet = createEnemyBullet;
    window._test.enemies = enemies;
    window._test.enemyBullets = enemyBullets;

    // New systems
    window._test.boss = boss;
    window._test.devilReef = devilReef;
    window._test.waveState = waveState;
    window._test.particles = particles;
    window._test.tentacles = tentacles;
    window._test.vfx = vfx;
    window._test.startWave = startWave;
    window._test.startBoss = startBoss;
    window._test.checkCollisions = checkCollisions;
    window._test.resetGame = resetGame;
    window._test.getHitbox = getHitbox;
    window._test.getFormationPositions = getFormationPositions;
    window._test.spawnParticle = spawnParticle;
    window._test.checkWaveComplete = checkWaveComplete;
    window._test.FONT = FONT;
    window._test.drawChar = drawChar;
    window._test.drawText = drawText;

    // Audio system
    window._test.initAudio = initAudio;
    window._test.playShot = playShot;
    window._test.playEnemyDeath = playEnemyDeath;
    window._test.playBossAppear = playBossAppear;
    window._test.playBossHit = playBossHit;
    window._test.playBossFire = playBossFire;
    window._test.playBossDeath = playBossDeath;
    window._test.playPlayerDeath = playPlayerDeath;

    // Rendering & state machine
    window._test.update = update;
    window._test.render = render;
    window._test.resize = resize;
    window._test.updatePlayer = updatePlayer;
    window._test.updateEnemies = updateEnemies;
    window._test.updateBoss = updateBoss;
    window._test.updateDevilReef = updateDevilReef;
    window._test.updateParticles = updateParticles;
    window._test.updateVfx = updateVfx;
    window._test.updateWaveSpawning = updateWaveSpawning;

    </script>
