    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {

            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.05s;

        .tc-move-btn:active, .tc-move-btn.active {

            border-bottom: 14px solid transparent;
        }
        .tc-arrow-left {
            border-right: 20px solid #8a7a50;

        .tc-arrow-right {
            border-left: 20px solid #8a7a50;

        .tc-move-btn.active .tc-arrow-bar { background: #b8a870; }
        #touch-fire-wrap {
            flex-shrink: 0;
            width: 110px;
            height: 80px;
            background: linear-gradient(180deg, #2a2a28 0%, #1a1a18 40%, #222220 100%);
            border: 3px solid #8a7a50;
            border-radius: 14px;
            position: relative;
            box-shadow:
                inset 0 2px 6px rgba(0,0,0,0.7),

            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Corner rivets on fire plate */
        #touch-fire-wrap .rivet {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #b8a870, #6a5a38 70%, #4a3a20);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 1px 2px rgba(0,0,0,0.5);

        #touch-fire-wrap .rivet-tl { top: 5px; left: 5px; }
        #touch-fire-wrap .rivet-tr { top: 5px; right: 5px; }
        #touch-fire-wrap .rivet-bl { bottom: 5px; left: 5px; }
        #touch-fire-wrap .rivet-br { bottom: 5px; right: 5px; }
        /* Deco lines left and right of button */
        #touch-fire-wrap::before, #touch-fire-wrap::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 16px;
            height: 2px;
            background: #6a5a38;
            transform: translateY(-50%);

        #touch-fire-wrap::before { left: 8px; }
        #touch-fire-wrap::after { right: 8px; }
        /* Brass ring */
        #touch-fire-ring {

    <script>
    // ============================================================
    // 1. Canvas Setup
    // ============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const RENDER_SCALE = 4; // game logic uses 256×224, canvas renders at 1024×896
    ctx.imageSmoothingEnabled = false;
    ctx.scale(RENDER_SCALE, RENDER_SCALE);

    // ============================================================
    // 1a. Asset Loading
    // ============================================================
    const assets = { ocean1: null, ocean2: null, sky: null };
    let assetsLoaded = 0;
    const assetsTotal = 19;

    function loadImage(key, src) {
        var img = new Image();
        img.onload = function() { assets[key] = img; assetsLoaded++; };
        img.onerror = function() { assetsLoaded++; };
        img.src = src;
    }
    loadImage('ocean1', 'assets/ocean1.png');
    loadImage('ocean2', 'assets/ocean2.png');
    loadImage('sky', 'assets/sky.png');
    loadImage('dockLeft', 'assets/dock-left.png');
    loadImage('dockRight', 'assets/dock-right.png');
    loadImage('beach', 'assets/beach.png');
    loadImage('devilReef', 'assets/devil-reef.png');
    loadImage('devilReefGlow', 'assets/devil-reef-glow.png');
    loadImage('screenBg', 'assets/screen-bg.png');
    loadImage('logo', 'assets/logo.png');
    loadImage('player', 'assets/player.png');
    loadImage('lanternLit', 'assets/lantern-lit.png');
    loadImage('lanternUnlit', 'assets/lantern-unlit.png');
    loadImage('bullet', 'assets/bullet.png');
    loadImage('crawlerImg', 'assets/crawler.png');
    loadImage('stalkerImg', 'assets/stalker.png');
    loadImage('flyerImg1', 'assets/flyer-1.png');
    loadImage('flyerImg2', 'assets/flyer-2.png');
    loadImage('bossImg', 'assets/boss.png');

    // Pre-fetch audio files as ArrayBuffers (before AudioContext exists)
    var sfxRawBuffers = {};
    function prefetchAudio(key, url) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'arraybuffer';
        xhr.onload = function() { if (xhr.status === 200) sfxRawBuffers[key] = xhr.response; };
        xhr.onerror = function() {};
        xhr.send();
    }
    prefetchAudio('shot', 'assets/shot.mp3');
    prefetchAudio('enemyDeath', 'assets/enemy-death.mp3');
    prefetchAudio('bossAppear', 'assets/boss-appear.mp3');
    prefetchAudio('playerDeath', 'assets/player-death.mp3');
    prefetchAudio('bossHit', 'assets/boss-hit.mp3');
    prefetchAudio('bossFire', 'assets/boss-fire.mp3');
    prefetchAudio('bossDeath', 'assets/boss-death.mp3');
    prefetchAudio('waveAnnounce', 'assets/wave-announce.mp3');
    prefetchAudio('lightning', 'assets/lightning.mp3');
    prefetchAudio('reefActivate', 'assets/reef-activate.mp3');
    prefetchAudio('reefHit', 'assets/reef-hit.mp3');
    prefetchAudio('playerRespawn', 'assets/player-respawn.mp3');
    prefetchAudio('gameOver', 'assets/game-over.mp3');
    prefetchAudio('gameStart', 'assets/game-start.mp3');
    prefetchAudio('crawlerSpawn', 'assets/crawler-spawn.mp3');
    prefetchAudio('flyerSpawn', 'assets/flyer-spawn.mp3');
    prefetchAudio('stalkerSpawn', 'assets/stalker-spawn.mp3');
    prefetchAudio('musicMain', 'assets/music-main.mp3');
    prefetchAudio('musicBoss', 'assets/music-boss.mp3');

    // ============================================================
    // 1b. Constants & Config Tables
    // ============================================================

    // Color Palette (12 colors)
    const C = {
        DEEP_OCEAN: '#0a1628', DARK_TEAL: '#1a3a3a', SICKLY_GREEN: '#2d5a3d',
        PALE_GRAY: '#8a9a8a', FOAM_WHITE: '#c8d8c8', MUTED_BLUE: '#3a5a7a',
        WARN_RED: '#8a2a2a', GLOW_YELLOW: '#c8a832', DARK_GRAY: '#2a2a2a',
        FLESH_PINK: '#6a4a4a', BLOOD_RED: '#5a1a1a', CLOUD_PURPLE: '#2a1a3a'
    };

    // Canvas Dimensions
    const W = 256, H = 224;

    // Zone Boundaries
    const ZONES = {
        SKY: { y: 0, h: 90 },
        OCEAN: { y: 90, h: 89 },
        HORIZON: { y: 88 },
        SHORELINE: { y: 179, h: 45 },
        HUD: { y: 0, h: 10 }
    };

    // Player Config
    const PLAYER = {
        w: 48, h: 48, speed: 2.0, y: 185,
        shotCooldownMax: 12, maxBullets: 2,
        invincibilityDuration: 120,
        hb: { x: 10, y: 4, w: 28, h: 20 }
    };

    // Enemy Configs
    const ENEMY_TYPES = {
        crawler: { w: 16, h: 16, baseSpeed: 0.25, maxSpeed: 0.7, speedInc: 0.03, animFrames: 2, animInterval: 15, fireChance: 0.001, points: 100, hb: { x: 0, y: 0, w: 16, h: 16 }, zigAmp: 6, zigPeriod: 200, bobAmp: 3, bobPeriod: 36 },
        flyer: { w: 32, h: 32, baseSpeed: 0.8, maxSpeed: 1.8, speedInc: 0.08, animFrames: 2, animInterval: 10, fireChance: 0.02, points: 200, hb: { x: 4, y: 4, w: 24, h: 24 } },
        stalker: { w: 16, h: 25, baseSpeed: 0.3, maxSpeed: 0.8, speedInc: 0.04, animFrames: 2, animInterval: 15, fireChance: 0.001, points: 150, hb: { x: 0, y: 0, w: 16, h: 25 } }
    };

    // Projectile Config
    const PELLET = { w: 3, h: 6, speed: 4.0, hb: { x: 0, y: 0, w: 3, h: 6 } };
    const ENEMY_BULLET = { w: 4, h: 4, baseSpeed: 1.5, maxSpeed: 2.5, hb: { x: 0, y: 0, w: 4, h: 4 } };

    // Boss Config
    const BOSS = {
        w: 128, h: 128, targetY: 24,
        weakHb: { x: 40, y: 0, w: 48, h: 32 },
        entranceDuration: 180,
        sinkDuration: 300, // frames for defeat sink animation
        scaling: [
            { hp: 10, speed: 0.3, cooldown: 90, tentacles: 2, spread: 5, minions: 0, minionInterval: 0 },
            { hp: 10, speed: 0.4, cooldown: 75, tentacles: 3, spread: 7, minions: 2, minionInterval: 300 },
            { hp: 10, speed: 0.5, cooldown: 60, tentacles: 3, spread: 9, minions: 4, minionInterval: 240 },
            { hp: 10, speed: 0.6, cooldown: 50, tentacles: 4, spread: 11, minions: 6, minionInterval: 180 }
        ]
    };

    // Tentacle Config
    const TENTACLE = { w: 24, telegraphDuration: 60, activeDuration: 120, minGap: 40, safeGap: 24 };

    // Devil Reef Config
    const REEF = { x: 160, y: 86, w: 32, h: 12, hb: { x: 0, y: 0, w: 32, h: 12 }, points: 500, cooldownMin: 1200, cooldownMax: 2400, activeMin: 180, activeMax: 300, clearChance: 0.5 };

    // Wave Table — base pattern per 5-wave round (wave 5 is boss, not in table)
    // Round N uses these counts multiplied by round number
    const WAVE_TABLE = [
        { types: ['crawler'], counts: { crawler: 16 }, formation: 'grid_2x4', spawnInterval: 25 },
        { types: ['flyer'], counts: { flyer: 6 }, formation: 'swarm', spawnInterval: 12 },
        { types: ['crawler', 'flyer'], counts: { crawler: 6, flyer: 4 }, formation: 'mixed_v', spawnInterval: 22 },
        { types: ['crawler', 'stalker'], counts: { crawler: 6, stalker: 2 }, formation: 'pincer', spawnInterval: 30 }
    ];

    // Difficulty Scaling
    const SCALING = {
        crawlerSpeed: { base: 0.25, inc: 0.03, cap: 0.7 },
        flyerSpeed: { base: 0.8, inc: 0.08, cap: 1.8 },
        stalkerSpeed: { base: 0.6, inc: 0.06, cap: 1.4 },
        enemyCount: { base: 1.0, inc: 0.15, cap: 2.5 },
        spawnInterval: { base: 30, inc: -1.5, cap: 10 },
        fireChance: { base: 0.001, inc: 0.0002, cap: 0.025 },
        maxEnemies: { base: 15, inc: 1, cap: 30 }
    };

    // Scoring Table
    const POINTS = { crawler: 100, flyer: 200, stalker: 150, bossHit: 50, bossDefeat: 1000, reef: 500 };

    // Entity Caps
    const CAPS = { playerBullets: 2, enemyBullets: 20, enemies: 50, particles: 100, tentacles: 5, sounds: 8 };

    // Timing
    const TIMING = { deathPause: 90, waveTransition: 120, bossEntrance: 180, invincibility: 120, tentacleTelegraph: 60, tentacleActive: 120, dtCap: 15, animBase: 15 };

    // Wharf Structures
    const WHARVES = {
        left: { x: 0, w: 28, topY: 170, bottomY: 140 },
        right: { x: 228, w: 28, topY: 170, bottomY: 140 }
    };

    // Stalker walking paths (feet coordinates — sprite draws at y - height)
    const STALKER_PATHS = {
        left: { startX: 0, startY: 170, endX: 56, endY: 159, dropY: 186 },
        right: { startX: 240, startY: 166, endX: 188, endY: 162, dropY: 187, clipX: 221, clipY1: 143, clipY2: 168 }
    };

    // Spawn Bounds
    const SPAWN = { offsetRange: 8, xMin: 8, xMax: 232, yMin: 20, yMax: 100, crawlerYMin: 92, crawlerYMax: 105, flyerYMin: 10, flyerYMax: 50, maxActive: 10 };

    // Randomization
    const RANDOM = { fireMin: 300, fireMax: 900, lightningMin: 300, lightningMax: 900, lightningDurMin: 3, lightningDurMax: 6 };

    // ============================================================
    // 2. Game State
    // ============================================================
    const state = {
        mode: 'START_SCREEN',
        stateTimer: 0,
        score: 0,
        highScore: 0,
        lives: 3,
        wave: 1,
        dt: 0,
        lastTime: 0,
        audioMuted: false,
        debugMode: false,
        debugPaused: false,
    };

    // ============================================================
    // 2b. Pure Utility Functions
    // ============================================================

    function aabbCollision(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function getWaveParam(base, increment, wave, cap) {
        if (increment < 0) return Math.max(base + increment * (wave - 1), cap);
        return Math.min(base + increment * (wave - 1), cap);
    }

    function getWaveConfig(wave) {
        // 5-wave rounds: waves 1-4 are enemies, wave 5 is boss
        var round = Math.floor((wave - 1) / 5) + 1; // round 1, 2, 3...
        var posInRound = ((wave - 1) % 5); // 0-3 = enemy waves, 4 = boss
        if (posInRound >= 4) posInRound = 3; // shouldn't happen (boss is handled separately), but safety
        var base = WAVE_TABLE[posInRound];
        // Scale counts by round number
        var counts = {};
        for (var i = 0; i < base.types.length; i++) {
            var t = base.types[i];
            counts[t] = Math.max(1, Math.round(base.counts[t] * round));
        }
        var si = Math.max(10, Math.round(base.spawnInterval - (round - 1) * 2));
        return { types: base.types.slice(), counts: counts, formation: base.formation, spawnInterval: si };
    }

    function computeScale(windowW, windowH) {
        return Math.max(1, Math.floor(Math.min(windowW / W, windowH / H)));
    }

    function clampSpawnPosition(x, y, offsetX, offsetY) {
        return {
            x: Math.max(SPAWN.xMin, Math.min(SPAWN.xMax, x + offsetX)),
            y: Math.max(SPAWN.yMin, Math.min(SPAWN.yMax, y + offsetY))
        };
    }

    function getBossConfig(encounterNum) {
        const idx = Math.min(encounterNum - 1, BOSS.scaling.length - 1);
        return { ...BOSS.scaling[idx] };
    }

    function getBossAttackType(attackIndex) {
        return attackIndex % 2 === 0 ? 'tentacle' : 'spread';
    }

    function resolveMovementInput(left, right) {
        if (left && right) return 0;
        if (left) return -1;
        if (right) return 1;
        return 0;
    }

    function canFire(cooldown, bulletCount) {
        return cooldown <= 0 && bulletCount < CAPS.playerBullets;
    }

    function clampBossX(bossX, bossW, canvasW) {
        return Math.max(0, Math.min(canvasW - bossW, bossX));
    }

    function placeTentacleColumns(count, canvasW, minGap, safeGap) {
        const margin = TENTACLE.w / 2;
        const minX = margin;
        const maxX = canvasW - margin;
        let n = count;
        while (n > 0) {
            const positions = [];
            let valid = true;
            for (let i = 0; i < n; i++) {
                let x, attempts = 0;
                do {
                    x = minX + Math.random() * (maxX - minX);
                    attempts++;
                    if (attempts > 100) { valid = false; break; }
                } while (positions.some(px => Math.abs(px - x) < minGap));
                if (!valid) break;
                positions.push(x);
            }
            if (valid && positions.length === n) {
                positions.sort((a, b) => a - b);
                // Check safe gap exists
                let hasSafe = positions[0] - 0 >= safeGap;
                for (let i = 1; i < positions.length; i++) {
                    if (positions[i] - positions[i - 1] - TENTACLE.w >= safeGap) hasSafe = true;
                }
                if (canvasW - positions[positions.length - 1] - TENTACLE.w >= safeGap) hasSafe = true;
                if (hasSafe) return positions.map(p => Math.round(p - TENTACLE.w / 2));
            }
            n--;
        }
        return [];
    }

    function loadHighScore() {
        try {
            const val = parseInt(localStorage.getItem('innsmouthInvaders_highScore'), 10);
            return (Number.isInteger(val) && val >= 0) ? val : 0;
        } catch { return 0; }
    }

    function saveHighScore(score) {
        try { localStorage.setItem('innsmouthInvaders_highScore', String(score)); } catch {}
    }

    // ============================================================
    // 3. Input System
    // ============================================================
    const keys = {};
    let firePressed = false;
    let lastInputSource = 'keyboard';

    document.addEventListener('keydown', function(e) {
        if (e.repeat) return;
        keys[e.code] = true;
        lastInputSource = 'keyboard';
        // Edge-detected fire
        if ((e.code === 'Space' || e.code === 'KeyZ') && !keys._fireHeld) {
            firePressed = true;
            keys._fireHeld = true;
        }
        // Mute toggle
        if (e.code === 'KeyM') {
            state.audioMuted = !state.audioMuted;
            if (masterGain) {
                try { masterGain.gain.value = state.audioMuted ? 0 : 1; } catch(ex) {}
            }
        }
        // Debug mode toggle
        if (e.ctrlKey && e.shiftKey && e.code === 'KeyD') {
            state.debugMode = !state.debugMode;
        }
        e.preventDefault();
    });

    document.addEventListener('keyup', function(e) {
        keys[e.code] = false;
        if (e.code === 'Space' || e.code === 'KeyZ') {
            keys._fireHeld = false;
        }
    });

    window.addEventListener('blur', function() {
        for (const k in keys) keys[k] = false;
        firePressed = false;
    });

    function consumeFireInput() {
        const fired = firePressed;
        firePressed = false;
        return fired;
    }

    // ============================================================
    // 3c. Entity Arrays
    // ============================================================
    let playerBullets = [];
    let enemies = [];
    let enemyBullets = [];
    let particles = [];
    let tentacles = [];

    // ============================================================
    // 3d. Player Entity
    // ============================================================
    const player = {
        x: 104, y: PLAYER.y,
        w: PLAYER.w, h: PLAYER.h,
        speed: PLAYER.speed,
        shotCooldown: 0,
        shotCooldownMax: PLAYER.shotCooldownMax,
        invincible: 0,
        animFrame: 0,
        animTimer: 0,
        firing: false,
        firingTimer: 0,
        alive: true,
        deathFrame: 0,
        deathTimer: 0,
        facing: 1, // 1 = right (default), -1 = left
        hbX: PLAYER.hb.x, hbY: PLAYER.hb.y,
        hbW: PLAYER.hb.w, hbH: PLAYER.hb.h,
    };

    // Gun barrel tip positions in game coords (from player top-left)
    // Right-facing (default image): x=35, y=8
    // Left-facing (mirrored): x=13, y=8
    var GUN_TIP_RIGHT = { x: 35, y: 8 };
    var GUN_TIP_LEFT = { x: 13, y: 8 };

    // ============================================================
    // 3e. Player Functions
    // ============================================================

    // Pure function: update player position based on input
    function updatePlayerPosition(p, input, dt) {
        const dir = resolveMovementInput(input.left, input.right);
        const newX = p.x + dir * p.speed * dt;
        return Math.max(0, Math.min(W - p.w, newX));
    }

    // Pure function: create a pellet at the player's position
    function spawnPellet(p) {
        return {
            x: p.x + GUN_TIP_RIGHT.x - PELLET.w / 2,
            y: p.y + GUN_TIP_RIGHT.y,
            w: PELLET.w, h: PELLET.h,
            vy: -PELLET.speed,
            alive: true,
            animFrame: 0,
            animTimer: 0,
            hbX: PELLET.hb.x, hbY: PELLET.hb.y,
            hbW: PELLET.hb.w, hbH: PELLET.hb.h,
        };
    }

    // Update player each frame
    function updatePlayer(dt) {
        if (!player.alive) return;

        // Movement
        const input = {
            left: !!keys['ArrowLeft'] || !!keys['KeyA'],
            right: !!keys['ArrowRight'] || !!keys['KeyD']
        };
        player.x = updatePlayerPosition(player, input, dt);

        // Track facing direction (hold last direction when stopped)
        if (input.left && !input.right) player.facing = -1;
        else if (input.right && !input.left) player.facing = 1;

        // Shooting
        if (consumeFireInput() && canFire(player.shotCooldown, playerBullets.length)) {
            playerBullets.push(spawnPellet(player));
            player.shotCooldown = player.shotCooldownMax;
            player.firing = true;
            player.firingTimer = 6;
            try { playShot(); } catch(e) {}
        }

        // Cooldown tick
        if (player.shotCooldown > 0) player.shotCooldown -= dt;

        // Firing flash timer
        if (player.firingTimer > 0) {
            player.firingTimer -= dt;
            if (player.firingTimer <= 0) player.firing = false;
        }

        // Invincibility countdown
        if (player.invincible > 0) player.invincible -= dt;

        // Idle animation (2-frame at 15-frame interval)
        player.animTimer += dt;
        if (player.animTimer >= TIMING.animBase) {
            player.animTimer = 0;
            player.animFrame = (player.animFrame + 1) % 2;
        }
    }

    // Render player
    function renderPlayer() {
        if (!player.alive) {
            // Sink animation — draw sprite sliding down until off screen
            if (player.y < H) {
                if (assets.player) {
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(assets.player, Math.round(player.x), Math.round(player.y), player.w, player.h);
                    ctx.imageSmoothingEnabled = false;
                } else {
                    var spriteSet = sprites.playerIdle;
                    var frame = player.animFrame % spriteSet.length;
                    ctx.drawImage(spriteSet[frame], Math.round(player.x), Math.round(player.y));
                }
            }
            return;
        }

        // Invincibility flash
        if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) {
            return;
        }

        // Use custom image if loaded, otherwise procedural sprites
        if (assets.player) {
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(assets.player, Math.round(player.x), Math.round(player.y), player.w, player.h);
            ctx.imageSmoothingEnabled = false;
        } else {
            var spriteSet = player.firing ? sprites.playerFire : sprites.playerIdle;
            var frame = player.animFrame % spriteSet.length;
            ctx.drawImage(spriteSet[frame], Math.round(player.x), Math.round(player.y));
        }

        // Muzzle flash glow at gun tip
        if (player.firing) {
            var tipX = player.x + GUN_TIP_RIGHT.x;
            var tipY = player.y + GUN_TIP_RIGHT.y;
            var flashR = 6 + Math.random() * 2;
            var glow = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, flashR);
            glow.addColorStop(0, 'rgba(255,240,180,0.9)');
            glow.addColorStop(0.3, 'rgba(255,200,100,0.6)');
            glow.addColorStop(0.6, 'rgba(255,160,60,0.3)');
            glow.addColorStop(1, 'rgba(255,120,40,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(tipX - flashR, tipY - flashR, flashR * 2, flashR * 2);
        }
    }

    // Update player bullets
    function updatePlayerBullets(dt) {
        for (let i = playerBullets.length - 1; i >= 0; i--) {
            const b = playerBullets[i];
            b.y += b.vy * dt;
            // Animation
            b.animTimer += dt;
            if (b.animTimer >= 8) {
                b.animTimer = 0;
                b.animFrame = (b.animFrame + 1) % sprites.pellet.length;
            }
            // Remove offscreen
            if (b.y + b.h < 0 || !b.alive) {
                playerBullets.splice(i, 1);
            }
        }
    }

    // Render player bullets
    function renderPlayerBullets() {
        for (const b of playerBullets) {
            if (assets.bullet) {
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(assets.bullet, Math.round(b.x), Math.round(b.y), b.w, b.h);
                ctx.imageSmoothingEnabled = false;
            } else {
                var cx = b.x + b.w / 2;
                var cy = b.y + b.h / 2;
                var r = 3;
                var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r + 2);
                glow.addColorStop(0, 'rgba(255,240,180,0.8)');
                glow.addColorStop(0.4, 'rgba(255,200,100,0.5)');
                glow.addColorStop(0.7, 'rgba(255,160,60,0.2)');
                glow.addColorStop(1, 'rgba(255,120,40,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(cx - r - 2, cy - r - 2, (r + 2) * 2, (r + 2) * 2);
                ctx.fillStyle = 'rgba(255,250,220,0.95)';
                ctx.beginPath();
                ctx.arc(cx, cy, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    // Hit player (called from collision system)
    function hitPlayer() {
        if (!player.alive || player.invincible > 0) return;
        state.lives--;
        player.alive = false;
        player.deathFrame = 0;
        player.deathTimer = 0;
        // Red particle burst at player position
        var cx = player.x + player.w / 2;
        var cy = player.y + player.h / 2;
        for (var i = 0; i < 20 && particles.length < CAPS.particles; i++) {
            var angle = Math.random() * Math.PI * 2;
            var speed = 0.5 + Math.random() * 1.5;
            particles.push({
                x: cx + (Math.random() - 0.5) * 12,
                y: cy + (Math.random() - 0.5) * 12,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 0.3,
                life: 20 + Math.random() * 30,
                maxLife: 50,
                frame: 0, type: 'playerDeath'
            });
        }
        state.mode = 'DEATH_PAUSE';
        state.stateTimer = TIMING.deathPause;
        try { playPlayerDeath(); } catch(e) {}
    }

    // Respawn player
    function respawnPlayer() {
        if (state.lives <= 0) {
            state.mode = 'GAME_OVER';
            stopMusic();
            try { playGameOver(); } catch(e) {}
            return;
        }
        player.x = 104;
        player.y = PLAYER.y;
        player.alive = true;
        player.invincible = TIMING.invincibility;
        player.shotCooldown = 0;
        player.firing = false;
        player.firingTimer = 0;
        player.animFrame = 0;
        player.animTimer = 0;
        player.deathFrame = 0;
        player.deathTimer = 0;
        state.mode = 'PLAYING';
        try { playPlayerRespawn(); } catch(e) {}
    }

    // ============================================================
    // 3f. Enemy System — Ocean Crawlers, Sky Flyers, Wharf Stalkers
    // ============================================================

    function createEnemy(type, x, y) {
        const cfg = ENEMY_TYPES[type];
        return {
            type: type, x: x, y: y,
            w: cfg.w, h: cfg.h,
            alive: true,
            animFrame: 0, animTimer: 0,
            vx: 0, vy: 0,
            phase: 0,
            moveState: 0,
            fireTimer: type === 'flyer' ? 20 + Math.random() * 40 : RANDOM.fireMin + Math.random() * (RANDOM.fireMax - RANDOM.fireMin),
            hbX: cfg.hb.x, hbY: cfg.hb.y, hbW: cfg.hb.w, hbH: cfg.hb.h,
            startX: x,
            baseY: y,
            lastBobDown: false,
            splashTimer: 0,
            direction: 1,
        };
    }

    function createEnemyBullet(x, y) {
        return {
            x: x, y: y,
            w: ENEMY_BULLET.w, h: ENEMY_BULLET.h,
            vy: ENEMY_BULLET.baseSpeed,
            alive: true,
            animFrame: 0, animTimer: 0,
            hbX: ENEMY_BULLET.hb.x, hbY: ENEMY_BULLET.hb.y,
            hbW: ENEMY_BULLET.hb.w, hbH: ENEMY_BULLET.hb.h,
        };
    }

    function updateEnemies(dt) {
        const wave = state.wave;
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (!e.alive) continue;
            const cfg = ENEMY_TYPES[e.type];
            const speed = getWaveParam(cfg.baseSpeed, cfg.speedInc, wave, cfg.maxSpeed);

            if (e.type === 'crawler') {
                e.phase += dt;
                // Advance base Y steadily downward
                e.baseY += speed * 0.5 * dt;

                // Zig-zag around the base position (slower period)
                var zigOffset = Math.sin(e.phase * (2 * Math.PI / cfg.zigPeriod)) * cfg.zigAmp;

                // Vertical bob — smooth hop using abs(sin) for a bounce shape
                var bobVal = -Math.abs(Math.sin(e.phase * (Math.PI / cfg.bobPeriod))) * cfg.bobAmp;
                var bobDown = bobVal > -0.5; // near bottom of hop (landed)

                // Splash when landing from a hop (transition to grounded)
                if (bobDown && !e.lastBobDown && e.baseY > ZONES.HORIZON.y) {
                    // Compute rendered size using same quantized scale as renderer
                    var minY = ZONES.HORIZON.y, maxY = ZONES.SHORELINE.y;
                    var st = Math.max(0, Math.min(1, (e.baseY - minY) / (maxY - minY)));
                    var SPLASH_STEPS = [11, 13, 16];
                    var sIdx = Math.min(SPLASH_STEPS.length - 1, Math.floor(st * SPLASH_STEPS.length));
                    var renderedW = SPLASH_STEPS[sIdx];
                    var splashX = e.x + (e.w - renderedW) / 2;
                    var splashY = e.baseY + e.h;
                    var splashCount = 6;
                    for (var si = 0; si < splashCount && particles.length < CAPS.particles; si++) {
                        particles.push({
                            x: splashX + (renderedW * si / (splashCount - 1)),
                            y: splashY,
                            vx: (Math.random() - 0.5) * 0.15,
                            vy: -(Math.random() * 0.3 + 0.1),
                            life: 8 + Math.random() * 6,
                            maxLife: 14,
                            frame: 0, type: 'splash'
                        });
                    }
                }
                e.lastBobDown = bobDown;
                e.lastBobDown = bobDown;

                // Steer toward center as they approach dock level
                var dockTopY = WHARVES.left.bottomY;
                var centerX = W / 2;
                var leftSafe = WHARVES.left.w + 16;
                var rightSafe = WHARVES.right.x - 16;

                if (e.baseY > ZONES.HORIZON.y) {
                    var steerT = Math.min(1, (e.baseY - ZONES.HORIZON.y) / (dockTopY - ZONES.HORIZON.y));
                    steerT = steerT * steerT;

                    var targetX = e.startX + (centerX - e.startX) * steerT * 0.6;
                    targetX = Math.max(leftSafe, Math.min(rightSafe - e.w, targetX));

                    e.x = targetX + zigOffset;
                } else {
                    e.x = e.startX + zigOffset;
                }

                // Final Y = base position + bob offset
                e.y = e.baseY + bobVal;
            } else if (e.type === 'flyer') {
                e.phase += dt;
                // Smooth curved flight — sweeping arc across screen then descending
                var flyDir = e.direction || 1;
                e.x += speed * 1.2 * flyDir * dt;
                e.x += Math.sin(e.phase * 0.05) * 0.5 * dt;
                e.y += speed * 0.15 * dt + Math.cos(e.phase * 0.04) * 0.3 * dt;
                
                // Once past center, start curving downward more
                if ((flyDir === 1 && e.x > W / 2) || (flyDir === -1 && e.x < W / 2)) {
                    e.y += speed * 0.2 * dt;
                }
            } else if (e.type === 'stalker') {
                if (e.moveState === 0) {
                    // Phase 0: Walk along dock surface
                    e.x += speed * e.direction * dt;
                    var path = e.direction === 1 ? STALKER_PATHS.left : STALKER_PATHS.right;
                    var totalDist = Math.abs(path.endX - path.startX);
                    var progress;
                    if (e.direction === 1) {
                        progress = Math.max(0, Math.min(1, (e.x - path.startX) / totalDist));
                    } else {
                        progress = Math.max(0, Math.min(1, (path.startX - e.x) / totalDist));
                    }
                    // Feet Y interpolated along dock surface
                    var feetY = path.startY + (path.endY - path.startY) * progress;
                    e.y = feetY - e.h;
                    // Transition to drop when reaching end of dock path
                    if ((e.direction === 1 && e.x >= path.endX) || (e.direction === -1 && e.x <= path.endX)) {
                        e.x = path.endX;
                        e.moveState = 1;
                    }
                } else if (e.moveState === 1) {
                    // Phase 1: Drop straight down to dropY
                    var path = e.direction === 1 ? STALKER_PATHS.left : STALKER_PATHS.right;
                    e.y += speed * 0.5 * dt;
                    if (e.y + e.h >= path.dropY) {
                        e.y = path.dropY - e.h;
                        e.moveState = 2;
                    }
                } else {
                    // Phase 2: Advance toward player (straight down)
                    e.y += speed * 0.5 * dt;
                }
            }

            // Animation
            e.animTimer += dt;
            if (e.animTimer >= cfg.animInterval) {
                e.animTimer = 0;
                e.animFrame = (e.animFrame + 1) % cfg.animFrames;
            }

            // Firing
            e.fireTimer -= dt;
            if (e.fireTimer <= 0 && enemyBullets.length < CAPS.enemyBullets) {
                const fireChance = getWaveParam(cfg.fireChance, SCALING.fireChance.inc, wave, SCALING.fireChance.cap);
                if (Math.random() < fireChance * 60) {
                    enemyBullets.push(createEnemyBullet(e.x + e.w / 2 - ENEMY_BULLET.w / 2, e.y + e.h));
                }
                e.fireTimer = e.type === 'flyer' ? 30 + Math.random() * 60 : RANDOM.fireMin + Math.random() * (RANDOM.fireMax - RANDOM.fireMin);
            }

            // Hit player if reached shoreline
            if (e.y + e.h >= ZONES.SHORELINE.y + 20) {
                hitPlayer();
                e.alive = false;
            }

            // Remove offscreen (bottom only — side exits bounce back)
            if (e.y > H) {
                e.alive = false;
            }
            // Bounce flyers back if they exit the sides or reach dock edges
            if (e.type === 'flyer') {
                if (e.x < WHARVES.left.w) { e.x = WHARVES.left.w; e.direction = 1; }
                else if (e.x + e.w > WHARVES.right.x) { e.x = WHARVES.right.x - e.w; e.direction = -1; }
            } else if (e.x + e.w < -20 || e.x > W + 20) {
                e.alive = false;
            }
        }
        enemies = enemies.filter(function(e) { return e.alive; });
    }

    function updateEnemyBullets(dt) {
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            const b = enemyBullets[i];
            if (b.vx) b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.animTimer += dt;
            if (b.animTimer >= 8) {
                b.animTimer = 0;
                b.animFrame = (b.animFrame + 1) % sprites.enemyBullet.length;
            }
            if (b.y > H || b.y < -10 || b.x < -10 || b.x > W + 10 || !b.alive) {
                enemyBullets.splice(i, 1);
            }
        }
    }

    function renderEnemies() {
        for (const e of enemies) {
            if (!e.alive || e.type === 'stalker') continue;
            const spriteSet = sprites[e.type];
            if (spriteSet) {
                const frame = e.animFrame % spriteSet.length;
                if (e.type === 'crawler') {
                    const minY = ZONES.HORIZON.y;
                    const maxY = ZONES.SHORELINE.y;
                    const baseYForScale = e.baseY !== undefined ? e.baseY : e.y;
                    const t = Math.max(0, Math.min(1, (baseYForScale - minY) / (maxY - minY)));
                    // Quantized scale steps to avoid frame-to-frame size flickering
                    const SCALE_STEPS = [11, 13, 16];
                    const stepIdx = Math.min(SCALE_STEPS.length - 1, Math.floor(t * SCALE_STEPS.length));
                    const sw = SCALE_STEPS[stepIdx];
                    const sh = SCALE_STEPS[stepIdx];
                    const dx = Math.round(e.x + (e.w - sw) / 2);
                    const dy = Math.round(e.y + (e.h - sh));
                    // Use loaded image if available, fall back to procedural sprite
                    if (assets.crawlerImg) {
                        ctx.drawImage(assets.crawlerImg, dx, dy, sw, sh);
                    } else {
                        ctx.drawImage(spriteSet[frame], dx, dy, sw, sh);
                    }
                } else {
                    // Flyers and other enemies
                    if (e.type === 'flyer' && assets.flyerImg1 && assets.flyerImg2) {
                        var flyerImg = (e.animFrame % 2 === 0) ? assets.flyerImg1 : assets.flyerImg2;
                        ctx.drawImage(flyerImg, Math.round(e.x), Math.round(e.y), e.w, e.h);
                    } else {
                        ctx.drawImage(spriteSet[frame], Math.round(e.x), Math.round(e.y));
                    }
                }
            }
        }
    }

    function renderStalkers() {
        for (const e of enemies) {
            if (!e.alive || e.type !== 'stalker') continue;
            var dx = Math.round(e.x);
            var dy = Math.round(e.y);
            var useClip = e.direction === -1 && STALKER_PATHS.right.clipX;
            
            if (useClip) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, STALKER_PATHS.right.clipX, H);
                ctx.clip();
            }

            if (assets.stalkerImg) {
                // Frame 0: normal, Frame 1: mirrored horizontally
                if (e.animFrame % 2 === 1) {
                    ctx.save();
                    ctx.translate(dx + e.w, dy);
                    ctx.scale(-1, 1);
                    ctx.drawImage(assets.stalkerImg, 0, 0, e.w, e.h);
                    ctx.restore();
                } else {
                    ctx.drawImage(assets.stalkerImg, dx, dy, e.w, e.h);
                }
            } else {
                const spriteSet = sprites[e.type];
                if (spriteSet) {
                    const frame = e.animFrame % spriteSet.length;
                    ctx.drawImage(spriteSet[frame], dx, dy);
                }
            }

            if (useClip) {
                ctx.restore();
            }
        }
    }

    function renderEnemyBullets() {
        for (const b of enemyBullets) {
            var bx = Math.round(b.x) + 2;
            var by = Math.round(b.y) + 2;
            // Outer glow
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = C.GLOW_YELLOW;
            ctx.beginPath();
            ctx.arc(bx, by, 3.5, 0, Math.PI * 2);
            ctx.fill();
            // Inner bright circle
            ctx.globalAlpha = 1;
            ctx.fillStyle = C.GLOW_YELLOW;
            ctx.beginPath();
            ctx.arc(bx, by, 2, 0, Math.PI * 2);
            ctx.fill();
            // Hot center
            ctx.fillStyle = C.FOAM_WHITE;
            ctx.beginPath();
            ctx.arc(bx, by, 1, 0, Math.PI * 2);
            ctx.fill();
        }
    }


    // ============================================================
    // 4. Delta-Time Computation
    // ============================================================
    function computeDt(now, lastTime) {
        let dt = Math.min((now - lastTime) / (1000 / 60), 15);
        dt = Math.max(dt, 0) || 1;
        return dt;
    }

    // ============================================================
    // 5. Devil Reef
    // ============================================================
    const devilReef = {
        active: false, timer: 0,
        cooldown: REEF.cooldownMin + Math.random() * (REEF.cooldownMax - REEF.cooldownMin),

    const boss = {

    function startBoss() {

        // Encounter 1: no minions, 2: crawlers, 3: crawlers+flyers, 4+: crawlers+flyers+stalkers
        var minionTypes = [];
        if (encounterNum >= 2) minionTypes.push('crawler');
        if (encounterNum >= 3) minionTypes.push('flyer');
        if (encounterNum >= 4) minionTypes.push('stalker');
        boss.minionTypes = minionTypes;

    function updateBoss(dt) {
        if (!boss.active) return;
        // Animation
        boss.animTimer += dt;
        if (boss.animTimer >= 20) { boss.animTimer = 0; boss.animFrame = (boss.animFrame + 1) % 2; }
        if (boss.hitFlash > 0) boss.hitFlash -= dt;

        // Update damage tint based on hits taken
        var hitsLanded = boss.maxHp - boss.hp;
        if (hitsLanded >= 7) boss.damageTint = 'red';
        else if (hitsLanded >= 4) boss.damageTint = 'green';
        else boss.damageTint = 'none';

        // Sinking defeat animation
        if (boss.sinking) {
            boss.sinkTimer -= dt;
            var sinkProgress = 1 - Math.max(0, boss.sinkTimer / BOSS.sinkDuration);
            var eased = sinkProgress * sinkProgress; // ease-in for accelerating sink
            boss.y = BOSS.targetY + (ZONES.HORIZON.y + BOSS.h - BOSS.targetY) * eased;
            // Splash during sink
            var splashY = ZONES.HORIZON.y + 5;
            for (var si = 0; si < 8; si++) {
                if (particles.length >= CAPS.particles) break;
                particles.push({
                    x: boss.x + Math.random() * BOSS.w, y: splashY + (Math.random() - 0.5) * 4,
                    vx: (Math.random() - 0.5) * 0.5, vy: -(Math.random() * 0.8 + 0.2),
                    life: 10 + Math.random() * 10, maxLife: 20, frame: 0, type: 'splash'
                });
            }
            if (boss.sinkTimer <= 0) {
                boss.active = false;
                tentacles.length = 0;
                enemies.length = 0;
                enemyBullets.length = 0;
                playerBullets.length = 0;
                state.mode = 'WAVE_TRANSITION';
                state.stateTimer = TIMING.waveTransition;
                state.wave++;
            }
            return;
        }

        // Entrance phase
        if (boss.attackPhase === 'entrance') {
            boss.entranceTimer -= dt;
            // Smooth linear rise from start position to target
            var progress = 1 - Math.max(0, boss.entranceTimer / TIMING.bossEntrance);
            // Ease-out for smooth deceleration
            var eased = 1 - (1 - progress) * (1 - progress);
            boss.y = boss._startY + (BOSS.targetY - boss._startY) * eased;
            if (boss.entranceTimer <= 0) {
                boss.y = BOSS.targetY;
                boss.attackPhase = 'cooldown';
                boss.attackTimer = boss.config.cooldown;
            }
            // Waterline splash during entrance
            var splashY = ZONES.HORIZON.y + 5;
            for (var si = 0; si < 10; si++) {
                if (particles.length >= CAPS.particles) break;
                particles.push({
                    x: boss.x + Math.random() * BOSS.w, y: splashY + (Math.random() - 0.5) * 4,
                    vx: (Math.random() - 0.5) * 0.3, vy: -(Math.random() * 0.5 + 0.1),
                    life: 12 + Math.random() * 12, maxLife: 24, frame: 0, type: 'splash'
                });
            }
            return;
        }

        // Horizontal movement
        boss.x += boss.speed * boss.direction * dt;
        boss.x = clampBossX(boss.x, boss.w, W);
        if (boss.x <= 0) boss.direction = 1;
        if (boss.x >= W - boss.w) boss.direction = -1;

        // Minion spawning — progressive enemy types per encounter
        if (boss.minionTypes && boss.minionTypes.length > 0 && boss.config.minionInterval > 0) {
            boss.minionTimer -= dt;
            if (boss.minionTimer <= 0) {
                boss.minionTimer = boss.config.minionInterval;
                if (enemies.length < CAPS.enemies) {
                    var mType = boss.minionTypes[boss.minionTypeIndex % boss.minionTypes.length];
                    boss.minionTypeIndex++;
                    if (mType === 'stalker') {
                        // Spawn from left or right edge
                        var fromLeft = Math.random() < 0.5;
                        var sx = fromLeft ? -16 : W;
                        var sy = STALKER_PATHS[fromLeft ? 'left' : 'right'].startY;
                        var minion = createEnemy('stalker', sx, sy - ENEMY_TYPES.stalker.h);
                        minion.direction = fromLeft ? 1 : -1;
                        enemies.push(minion);
                    } else {
                        var mx = 20 + Math.random() * (W - 40);
                        var my = mType === 'crawler'
                            ? SPAWN.crawlerYMin + Math.random() * (SPAWN.crawlerYMax - SPAWN.crawlerYMin)
                            : SPAWN.flyerYMin + Math.random() * (SPAWN.flyerYMax - SPAWN.flyerYMin);
                        var minion = createEnemy(mType, mx, my);
                        enemies.push(minion);
                    }
                }
            }
        }

        // Continuous alternating hand fire (4 projectiles per hand, alternating left/right)
        boss.handFireTimer -= dt;
        if (boss.handFireTimer <= 0) {
            boss.handFireTimer = Math.max(30, Math.round(boss.config.cooldown * 0.6)); // fire faster than cooldown
            var handX, handY;
            if (boss.handFireSide === 0) {
                handX = boss.x + 8;
                handY = boss.y + 40;
            } else {
                handX = boss.x + boss.w - 8;
                handY = boss.y + 40;
            }
            for (var fi = 0; fi < 4; fi++) {
                var angle = -0.7 + (1.4 * fi / 3);
                if (enemyBullets.length < CAPS.enemyBullets) {
                    var b = createEnemyBullet(handX - 2, handY);
                    b.vx = Math.sin(angle) * 1.4;
                    b.vy = Math.cos(angle) * 1.6;
                    enemyBullets.push(b);
                }
            }
            boss.handFireSide = 1 - boss.handFireSide;
            try { playBossFire(); } catch(e) {}
        }

        // Attack state machine (tentacle cycle only — spread replaced by continuous fire)
        if (boss.attackPhase === 'cooldown') {
            boss.attackTimer -= dt;
            if (boss.attackTimer <= 0) {
                boss.attackPhase = 'telegraph';
                boss.attackTimer = TIMING.tentacleTelegraph;
                var cols = placeTentacleColumns(boss.config.tentacles, W, TENTACLE.minGap, TENTACLE.safeGap);
                tentacles.length = 0;
                for (var ci = 0; ci < cols.length; ci++) {
                    tentacles.push({ x: cols[ci], y: 0, w: TENTACLE.w, h: H, phase: 'telegraph', timer: TIMING.tentacleTelegraph, animFrame: 0, animTimer: 0 });
                }
                boss.attackIndex++;
            }
        } else if (boss.attackPhase === 'telegraph') {
            boss.attackTimer -= dt;
            for (var ti = 0; ti < tentacles.length; ti++) { var t = tentacles[ti]; t.animTimer += dt; if (t.animTimer >= 10) { t.animTimer = 0; t.animFrame = (t.animFrame + 1) % 2; } }
            if (boss.attackTimer <= 0) {
                boss.attackPhase = 'tentacle';
                boss.attackTimer = TIMING.tentacleActive;
                for (var ti = 0; ti < tentacles.length; ti++) { tentacles[ti].phase = 'active'; tentacles[ti].timer = TIMING.tentacleActive; tentacles[ti].animFrame = 0; }
            }
        } else if (boss.attackPhase === 'tentacle') {
            boss.attackTimer -= dt;
            for (var ti = 0; ti < tentacles.length; ti++) { var t = tentacles[ti]; t.animTimer += dt; if (t.animTimer >= 8) { t.animTimer = 0; t.animFrame = (t.animFrame + 1) % 3; } }
            if (boss.attackTimer <= 0) {
                tentacles.length = 0;
                boss.attackPhase = 'cooldown';
                boss.attackTimer = boss.config.cooldown;
            }
        }

        // Waterline splash — constant white water across full boss width
        var splashY = ZONES.HORIZON.y + 5;
        var splashCount = 8;
        for (var si = 0; si < splashCount; si++) {
            if (particles.length >= CAPS.particles) break;
            var splashX = boss.x + Math.random() * BOSS.w;
            particles.push({
                x: splashX, y: splashY + (Math.random() - 0.5) * 4,
                vx: (Math.random() - 0.5) * 0.3,
                vy: -(Math.random() * 0.5 + 0.1),
                life: 12 + Math.random() * 12,
                maxLife: 24,
                frame: 0, type: 'splash'
            });
        }

        // Boss defeat — trigger sink animation
        if (boss.hp <= 0 && !boss.sinking) {
            state.score += POINTS.bossDefeat;
            if (state.score > state.highScore) { state.highScore = state.score; saveHighScore(state.highScore); }
            boss.sinking = true;
            boss.sinkTimer = BOSS.sinkDuration;
            tentacles.length = 0;
            boss.attackPhase = 'defeated';
            try { playBossDeath(); } catch(e) {}
        }
    }

    // Offscreen canvas for boss tinting (reused each frame)
    // Sized to match the actual boss PNG resolution to avoid pixelation
    var _bossTintCanvas = document.createElement('canvas');
    var _bossTintCtx = null;
    var _bossTintReady = false;

    function ensureBossTintCanvas() {
        if (_bossTintReady) return;
        if (assets.bossImg) {
            _bossTintCanvas.width = assets.bossImg.naturalWidth || assets.bossImg.width;
            _bossTintCanvas.height = assets.bossImg.naturalHeight || assets.bossImg.height;
        } else {
            _bossTintCanvas.width = BOSS.w;
            _bossTintCanvas.height = BOSS.h;
        }
        _bossTintCtx = _bossTintCanvas.getContext('2d');
        _bossTintCtx.imageSmoothingEnabled = false;
        _bossTintReady = true;
    }

    function renderBoss() {
        if (!boss.active) return;
        // Always clip below horizon so boss appears waist-deep in ocean
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, ZONES.HORIZON.y + 5);
        ctx.clip();

        var bx = Math.round(boss.x);
        var by = Math.round(boss.y);

        // Determine tint
        var tintColor = null;
        var tintAlpha = 0;
        if (boss.damageTint === 'red') { tintColor = C.WARN_RED; tintAlpha = 0.3; }
        else if (boss.damageTint === 'green') { tintColor = C.SICKLY_GREEN; tintAlpha = 0.25; }
        if (boss.hitFlash > 0) { tintColor = C.GLOW_YELLOW; tintAlpha = Math.min(0.5, boss.hitFlash / 6); }

        if (tintColor) {
            ensureBossTintCanvas();
            var tc = _bossTintCtx;
            var tw = _bossTintCanvas.width;
            var th = _bossTintCanvas.height;
            tc.clearRect(0, 0, tw, th);
            if (assets.bossImg) {
                // Draw at native PNG resolution
                tc.drawImage(assets.bossImg, 0, 0, tw, th);
            } else {
                var bf = boss.animFrame % sprites.bossBody.length;
                tc.drawImage(sprites.bossBody[bf], 0, 0);
                var hf = boss.hitFlash > 0 ? 1 : 0;
                tc.drawImage(sprites.bossHead[hf], BOSS.weakHb.x, BOSS.weakHb.y);
            }
            // source-atop: tint fill only covers existing opaque pixels
            tc.globalAlpha = tintAlpha;
            tc.globalCompositeOperation = 'source-atop';
            tc.fillStyle = tintColor;
            tc.fillRect(0, 0, tw, th);
            tc.globalCompositeOperation = 'source-over';
            tc.globalAlpha = 1;
            // Draw the tinted result scaled down to game coordinates
            ctx.drawImage(_bossTintCanvas, bx, by, BOSS.w, BOSS.h);
        } else {
            // No tint — draw directly

            } else {
                var bf = boss.animFrame % sprites.bossBody.length;

                var hf = boss.hitFlash > 0 ? 1 : 0;
                ctx.drawImage(sprites.bossHead[hf], bx + BOSS.weakHb.x, by + BOSS.weakHb.y);
            }
        }

        ctx.restore();
    }

    // ============================================================
    // 7. Particle System
    // ============================================================
    function spawnParticle(x, y, type) {
        if (particles.length >= CAPS.particles) return;
        const count = type === 'death' ? 4 : type === 'splash' ? 3 : 3;
        for (let i = 0; i < count && particles.length < CAPS.particles; i++) {
            particles.push({
                x: x + (Math.random() - 0.5) * (type === 'splash' ? 16 : type === 'death' ? 4 : 2),
                y: y + (type === 'death' ? (Math.random() - 0.5) * 4 : 0),
                vx: (Math.random() - 0.5) * (type === 'splash' ? 0.3 : type === 'death' ? 0.5 : 2),
                vy: type === 'splash' ? -(Math.random() * 0.3 + 0.15) : type === 'death' ? (Math.random() - 0.5) * 0.5 : (Math.random() - 0.5) * 2 - 0.5,
                life: type === 'splash' ? 8 + Math.random() * 6 : type === 'death' ? 10 + Math.random() * 8 : 30 + Math.random() * 20,
                maxLife: type === 'splash' ? 14 : type === 'death' ? 18 : 50,
                frame: 0, type: type
            });
        }
    }

    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 0.03 * dt; // gravity
            p.life -= dt;
            if (p.life <= 0) { particles.splice(i, 1); }
        }
    }

    function renderParticles() {
        for (const p of particles) {
            if (p.type === 'playerDeath') continue; // drawn separately on top of player
            const alpha = Math.max(0, p.life / p.maxLife);
            ctx.globalAlpha = alpha;
            if (p.type === 'reef') {
                ctx.fillStyle = C.GLOW_YELLOW;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), 3, 3);
                ctx.fillStyle = 'rgba(255,240,180,0.8)';
                ctx.fillRect(Math.round(p.x + 1), Math.round(p.y + 1), 1, 1);
            } else if (p.type === 'reefCore') {
                ctx.fillStyle = C.FOAM_WHITE;
                ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 4, 4);
                ctx.fillStyle = C.GLOW_YELLOW;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
            } else if (p.type === 'death') {
                ctx.fillStyle = C.BLOOD_RED;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
                ctx.fillStyle = C.SICKLY_GREEN;
                ctx.fillRect(Math.round(p.x + 1), Math.round(p.y + 1), 1, 1);
            } else if (p.type === 'playerDeath') {
                var radius = 1 + Math.random();
                var sz = Math.round(radius * 2);
                ctx.fillStyle = C.BLOOD_RED;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), sz, sz);
                ctx.fillStyle = C.WARN_RED;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.max(1, sz - 1), Math.max(1, sz - 1));
            } else if (p.type === 'splash') {
                ctx.fillStyle = C.FOAM_WHITE;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
            } else {
                ctx.fillStyle = C.FOAM_WHITE;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
            }
        }
        ctx.globalAlpha = 1;
    }

    function renderPlayerDeathParticles() {
        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            if (p.type !== 'playerDeath') continue;
            var alpha = Math.max(0, p.life / p.maxLife);
            ctx.globalAlpha = alpha;
            var sz = 2 + Math.round(Math.random());
            ctx.fillStyle = C.BLOOD_RED;
            ctx.fillRect(Math.round(p.x), Math.round(p.y), sz, sz);
            ctx.fillStyle = C.WARN_RED;
            ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.max(1, sz - 1), Math.max(1, sz - 1));
        }
        ctx.globalAlpha = 1;
    }

    // ============================================================
    // 8. Wave System
    // ============================================================
    const waveState = {
        spawning: false, spawnQueue: [], spawnTimer: 0, spawnedCount: 0, totalEnemies: 0, spawnInterval: 30
    };

    function getFormationPositions(formation, counts) {
        const positions = [];
        const types = Object.keys(counts);
        const total = types.reduce(function(s, t) { return s + counts[t]; }, 0);

        function spawnY(type, row) {
            if (type === 'crawler') return SPAWN.crawlerYMin + row * 10;
            if (type === 'flyer') return SPAWN.flyerYMin + row * 12;
            return 30 + row * 20;
        }

        if (formation === 'grid_2x4') {
            let idx = 0;
            for (const t of types) {
                for (let i = 0; i < counts[t]; i++) {
                    const row = Math.floor(idx / 8);
                    // Spread across full canvas width (16px margin each side)
                    const x = 16 + Math.random() * (W - 48);
                    positions.push({ type: t, x: x, y: spawnY(t, row) });
                    idx++;
                }
            }
        } else if (formation === 'grid_2x5') {
            let idx = 0;
            for (const t of types) {
                for (let i = 0; i < counts[t]; i++) {
                    const row = Math.floor(idx / 5), col = idx % 5;
                    positions.push({ type: t, x: 68 + col * 24, y: spawnY(t, row) });
                    idx++;
                }
            }
        } else if (formation === 'mixed_v') {
            let idx = 0;
            // Back row: crawlers at horizon
            const t0 = types[0];
            for (let i = 0; i < counts[t0]; i++) {
                positions.push({ type: t0, x: 64 + i * 24, y: spawnY(t0, 0) });
                idx++;
            }
            // V formation: flyers in sky
            if (types[1]) {
                const t1 = types[1];
                for (let i = 0; i < counts[t1]; i++) {
                    const vx = 96 + (i % 2 === 0 ? -1 : 1) * (Math.floor(i / 2) + 1) * 20;
                    positions.push({ type: t1, x: vx, y: spawnY(t1, 0) + Math.abs(i - counts[t1] / 2) * 8 });
                }
            }
        } else if (formation === 'mixed_wave') {
            let idx = 0;
            for (const t of types) {
                for (let i = 0; i < counts[t]; i++) {
                    const row = Math.floor(idx / 5), col = idx % 5;
                    positions.push({ type: t, x: 68 + col * 24, y: spawnY(t, row) });
                    idx++;
                }
            }
        } else if (formation === 'pincer') {
            // Place each type appropriately
            for (const t of types) {
                if (t === 'stalker') {
                    // Stalkers from edges, alternating sides
                    let nextLeft = Math.random() < 0.5;
                    for (let i = 0; i < counts[t]; i++) {
                        var spawnX, spawnY, spawnDir;
                        if (nextLeft) {
                            spawnX = -16; // off-screen left
                            spawnY = STALKER_PATHS.left.startY - 16; // feet Y minus sprite height
                            spawnDir = 1;
                        } else {
                            spawnX = STALKER_PATHS.right.startX; // behind building
                            spawnY = STALKER_PATHS.right.startY - 16; // feet Y minus sprite height
                            spawnDir = -1;
                        }
                        positions.push({
                            type: t,
                            x: spawnX,
                            y: spawnY,
                            direction: spawnDir,
                            _stalkerDelay: i
                        });
                        nextLeft = !nextLeft;
                    }
                } else {
                    // Other types (crawlers etc) from horizon
                    for (let i = 0; i < counts[t]; i++) {
                        const x = 16 + Math.random() * (W - 48);
                        positions.push({ type: t, x: x, y: SPAWN.crawlerYMin + Math.floor(i / 4) * 10 });
                    }
                }
            }
        } else if (formation === 'swarm') {
            // Alternate from left and right sides of the screen
            var nextFromLeft = true;
            for (const t of types) {
                for (let i = 0; i < counts[t]; i++) {
                    var sx = nextFromLeft ? -16 - Math.random() * 30 : W + Math.random() * 30;
                    var sy = SPAWN.flyerYMin + Math.random() * (SPAWN.flyerYMax - SPAWN.flyerYMin);
                    positions.push({ type: t, x: sx, y: sy, direction: nextFromLeft ? 1 : -1 });
                    nextFromLeft = !nextFromLeft;
                }
            }
        } else {
            // Fallback: grid
            let idx = 0;
            for (const t of types) {
                for (let i = 0; i < counts[t]; i++) {
                    const row = Math.floor(idx / 4), col = idx % 4;
                    positions.push({ type: t, x: 80 + col * 24, y: spawnY(t, row) });
                    idx++;
                }
            }
        }
        return positions;
    }

    function startWave(waveNum) {
        const cfg = getWaveConfig(waveNum);
        const positions = getFormationPositions(cfg.formation, cfg.counts);
        waveState.spawnQueue = positions.map(function(p) {
            const ox = (Math.random() - 0.5) * 2 * SPAWN.offsetRange;
            const oy = (Math.random() - 0.5) * 2 * SPAWN.offsetRange;
            const clamped = (p.type === 'stalker' || (p.type === 'flyer' && (p.x < 0 || p.x >= W)))
                ? { x: p.x, y: p.y }
                : clampSpawnPosition(p.x, p.y, ox, oy);
            return { type: p.type, x: clamped.x, y: clamped.y, direction: p.direction || 1 };
        });
        waveState.spawning = true;
        waveState.spawnTimer = 0;
        waveState.spawnedCount = 0;
        waveState.totalEnemies = positions.length;
        waveState.spawnInterval = cfg.spawnInterval;
        waveState._heardCrawler = false;
        waveState._heardFlyer = false;
    }

    function updateWaveSpawning(dt) {
        if (!waveState.spawning) return;
        waveState.spawnTimer -= dt;
        if (waveState.spawnTimer <= 0 && waveState.spawnQueue.length > 0) {
            const next = waveState.spawnQueue[0];
            // Stalkers: only spawn when no other stalker is alive on screen
            if (next.type === 'stalker') {
                const activeStalkers = enemies.filter(function(e) { return e.alive && e.type === 'stalker'; }).length;
                if (activeStalkers > 0) return; // wait for current stalker to be cleared
            }
            const activeSpawning = enemies.filter(function(e) { return e.y < SPAWN.yMax + 20; }).length;
            if (activeSpawning < SPAWN.maxActive && enemies.length < CAPS.enemies) {
                waveState.spawnQueue.shift();
                const e = createEnemy(next.type, next.x, next.y);
                e.direction = next.direction;
                enemies.push(e);
                waveState.spawnedCount++;
                waveState.spawnTimer = waveState.spawnInterval;
                // Spawn sounds: first of each type always plays, then ~20% chance; stalkers always
                try {
                    if (next.type === 'stalker') { playStalkerSpawn(); }
                    else if (next.type === 'crawler') {
                        if (!waveState._heardCrawler || Math.random() < 0.2) { playCrawlerSpawn(); waveState._heardCrawler = true; }
                    }
                    else if (next.type === 'flyer') {
                        if (!waveState._heardFlyer || Math.random() < 0.2) { playFlyerSpawn(); waveState._heardFlyer = true; }
                    }
                } catch(ex) {}
            }
        }
        if (waveState.spawnQueue.length === 0) {
            waveState.spawning = false;
        }
    }

    function checkWaveComplete() {
        if (state.mode !== 'PLAYING') return;
        if (waveState.spawning) return;
        if (enemies.length > 0) return;
        if (waveState.spawnedCount === 0) return;
        // All enemies spawned and destroyed — wave cleared
        // Check if next wave should be a boss (after every 4th wave in a round)
        if ((state.wave + 1) % 5 === 0) {
            state.wave++;
            state.mode = 'WAVE_TRANSITION';
            state.stateTimer = TIMING.waveTransition;
            state._pendingBoss = true;
            devilReef.active = false;
            enemyBullets.length = 0;
            playerBullets.length = 0;
        } else {
            state.mode = 'WAVE_TRANSITION';
            state.stateTimer = TIMING.waveTransition;
            state.wave++;
            devilReef.active = false;
            enemyBullets.length = 0;
            playerBullets.length = 0;
        }
    }


    // ============================================================
    // 9. Collision Detection
    // ============================================================
    function getHitbox(e) {
        return { x: e.x + (e.hbX || 0), y: e.y + (e.hbY || 0), w: e.hbW || e.w, h: e.hbH || e.h };
    }

    function checkCollisions() {
        const pAlive = player.alive && player.invincible <= 0;

        // Player pellets vs enemies
        for (let i = playerBullets.length - 1; i >= 0; i--) {
            const b = playerBullets[i];
            if (!b.alive) continue;
            const bHb = getHitbox(b);
            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                if (!e.alive) continue;
                const eHb = getHitbox(e);
                if (aabbCollision(bHb, eHb)) {
                    b.alive = false;
                    e.alive = false;
                    state.score += POINTS[e.type] || 0;
                    if (state.score > state.highScore) { state.highScore = state.score; saveHighScore(state.highScore); }
                    spawnParticle(e.x + e.w / 2, e.y + e.h / 2, 'death');
                    try { playEnemyDeath(); } catch(ex) {}
                    break;
                }
            }
        }

        // Player pellets vs boss weak point
        if (boss.active && boss.attackPhase !== 'entrance' && !boss.sinking) {
            const weakHb = {
                x: boss.x + BOSS.weakHb.x, y: boss.y + BOSS.weakHb.y,
                w: BOSS.weakHb.w, h: BOSS.weakHb.h
            };
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i];
                if (!b.alive) continue;
                const bHb = getHitbox(b);
                if (aabbCollision(bHb, weakHb)) {
                    b.alive = false;
                    boss.hp--;
                    boss.hitFlash = 6;
                    state.score += POINTS.bossHit;
                    if (state.score > state.highScore) { state.highScore = state.score; saveHighScore(state.highScore); }
                    try { playBossHit(); } catch(ex) {}
                }
                // Pellets pass through non-weak-point boss body — no collision check needed
            }
        }

        // Player pellets vs active Devil Reef
        if (devilReef.active) {
            const rHb = { x: devilReef.x, y: devilReef.y, w: devilReef.w, h: devilReef.h };
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i];
                if (!b.alive) continue;
                const bHb = getHitbox(b);
                if (aabbCollision(bHb, rHb)) {
                    b.alive = false;
                    state.score += REEF.points;
                    if (state.score > state.highScore) { state.highScore = state.score; saveHighScore(state.highScore); }
                    devilReef.active = false;
                    devilReef.cooldown = REEF.cooldownMin + Math.random() * (REEF.cooldownMax - REEF.cooldownMin);
                    // Golden starburst explosion on reef — contained to sell distance
                    var rcx = devilReef.x + REEF.w / 2;
                    var rcy = devilReef.y + REEF.h / 2;
                    for (var ri = 0; ri < 12 && particles.length < CAPS.particles; ri++) {
                        var angle = (ri / 12) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
                        var speed = 0.25 + Math.random() * 0.45;
                        particles.push({
                            x: rcx + (Math.random() - 0.5) * 4,
                            y: rcy + (Math.random() - 0.5) * 3,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed - 0.1,
                            life: 20 + Math.random() * 25,
                            maxLife: 45,
                            frame: 0, type: 'reef'
                        });
                    }
                    // Inner bright core burst
                    for (var ri = 0; ri < 5 && particles.length < CAPS.particles; ri++) {
                        var angle = Math.random() * Math.PI * 2;
                        particles.push({
                            x: rcx, y: rcy,
                            vx: Math.cos(angle) * 0.1,
                            vy: Math.sin(angle) * 0.1 - 0.05,
                            life: 12 + Math.random() * 12,
                            maxLife: 24,
                            frame: 0, type: 'reefCore'
                        });
                    }
                    try { playReefHit(); } catch(ex) {}
                    // Clear all enemies
                    for (const e of enemies) { e.alive = false; spawnParticle(e.x + 8, e.y + 8, 'death'); }
                    break;
                }
            }
        }

        // Enemy bullets vs player
        if (pAlive) {
            const pHb = getHitbox(player);
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                if (!b.alive) continue;
                const bHb = getHitbox(b);
                if (aabbCollision(pHb, bHb)) {
                    b.alive = false;
                    hitPlayer();
                    break;
                }
            }
        }

        // Enemy contact vs player
        if (player.alive && player.invincible <= 0) {
            const pHb = getHitbox(player);
            for (const e of enemies) {
                if (!e.alive) continue;
                const eHb = getHitbox(e);
                if (aabbCollision(pHb, eHb)) {
                    e.alive = false;
                    hitPlayer();
                    break;
                }
            }
        }

        // Tentacle columns vs player — disabled (rendering disabled)
        // if (player.alive && player.invincible <= 0) {
        //     const pHb = getHitbox(player);
        //     for (const t of tentacles) {
        //         if (t.phase !== 'active') continue;
        //         const tHb = { x: t.x, y: t.y, w: t.w, h: t.h };
        //         if (aabbCollision(pHb, tHb)) {
        //             hitPlayer();
        //             break;
        //         }
        //     }
        // }

        // Cleanup dead entities
        playerBullets = playerBullets.filter(function(b) { return b.alive; });
        enemies = enemies.filter(function(e) { return e.alive; });
        enemyBullets = enemyBullets.filter(function(b) { return b.alive; });
    }


    // ============================================================
    // 10. Audio System
    // ============================================================
    let audioCtx = null;
    let masterGain = null, sfxGain = null, ambientGain = null;
    let activeSounds = 0;
    let audioInitialized = false;

    function initAudio() {
        if (audioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            sfxGain = audioCtx.createGain();
            ambientGain = audioCtx.createGain();
            sfxGain.connect(masterGain);
            ambientGain.connect(masterGain);
            masterGain.connect(audioCtx.destination);
            ambientGain.gain.value = 0.15;
            sfxGain.gain.value = 0.4;
            // iOS unlock: play a silent buffer to fully activate the context
            var silentBuf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
            var silentSrc = audioCtx.createBufferSource();
            silentSrc.buffer = silentBuf;
            silentSrc.connect(audioCtx.destination);
            silentSrc.start(0);
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioInitialized = true;
        } catch(e) {}
    }

    // Ensure audio init on any user interaction (iOS needs this from touch handlers)
    document.addEventListener('touchstart', function() { initAudio(); }, { once: true });
    document.addEventListener('click', function() { initAudio(); }, { once: true });

    // ---- Music System (Audio elements for iOS compatibility) ----
    var musicElements = {};
    var musicCurrent = null; // 'main' | 'boss' | null

    function loadMusicBuffers() {
        try {
            var m = new Audio('assets/music-main.mp3');
            m.loop = true; m.volume = 0.35;
            musicElements['main'] = m;
        } catch(e) {}
        try {
            var b = new Audio('assets/music-boss.mp3');
            b.loop = true; b.volume = 0.35;
            musicElements['boss'] = b;
        } catch(e) {}
    }
    loadMusicBuffers();

    function playMusic(key) {
        if (state.audioMuted) return;
        if (musicCurrent === key) return;
        stopMusic();
        var a = musicElements[key];
        if (!a) return;
        try {
            a.currentTime = 0;
            var p = a.play();
            if (p) {
                p.then(function() {
                    musicCurrent = key;
                }).catch(function() {
                    // Play failed (not yet unlocked) — don't set musicCurrent
                    // so the next call will retry
                    musicCurrent = null;
                });
            } else {
                musicCurrent = key;
            }
        } catch(e) {
            musicCurrent = null;
        }
    }

    function stopMusic() {
        if (musicCurrent && musicElements[musicCurrent]) {
            try { musicElements[musicCurrent].pause(); musicElements[musicCurrent].currentTime = 0; } catch(e) {}
        }
        musicCurrent = null;
    }

    function playSound(fn, priority) {
        if (!audioInitialized || state.audioMuted || activeSounds >= CAPS.sounds) return;
        try {
            fn();
            activeSounds++;
            setTimeout(function() { activeSounds = Math.max(0, activeSounds - 1); }, 300);
        } catch(e) {}
    }

    // Unlock all audio elements on first user interaction (iOS requirement)

        if (_sfxUnlocked) return;
        _sfxUnlocked = true;
        for (var k in sfxElements) { try { sfxElements[k].load(); } catch(e) {} }

    // ============================================================
    // 11. Visual Effects — Lightning, Ocean Animation
    // ============================================================
    const vfx = {
        lightningTimer: RANDOM.lightningMin + Math.random() * (RANDOM.lightningMax - RANDOM.lightningMin),
        lightningDuration: 0,
        lightningActive: false,
        oceanPhase: 0
    };

    function updateVfx(dt) {
        // Lightning — rapid flashes during boss fight, very rapid during entrance
        var bossFight = boss.active;
        var bossEntrance = boss.active && boss.attackPhase === 'entrance';
        if (vfx.lightningActive) {
            vfx.lightningDuration -= dt;
            if (vfx.lightningDuration <= 0) vfx.lightningActive = false;
        } else {
            vfx.lightningTimer -= dt;
            if (vfx.lightningTimer <= 0) {
                vfx.lightningActive = true;
                vfx.lightningDuration = RANDOM.lightningDurMin + Math.random() * (RANDOM.lightningDurMax - RANDOM.lightningDurMin);
                try { playLightning(); } catch(e) {}
                if (bossEntrance) {
                    // Frantic flashes during entrance
                    vfx.lightningTimer = 8 + Math.random() * 15;
                } else if (bossFight) {
                    // Frequent flashes throughout boss fight (every 1-3 seconds)
                    vfx.lightningTimer = 60 + Math.random() * 120;
                } else {
                    vfx.lightningTimer = RANDOM.lightningMin + Math.random() * (RANDOM.lightningMax - RANDOM.lightningMin);
                }
            }
        }
        // Ocean
        vfx.oceanPhase += dt * 0.02;
    }

    function renderLightning() {
        if (!vfx.lightningActive) return;
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = C.FOAM_WHITE;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }

    function renderOceanWaves() {
        var t = vfx.oceanPhase;
        var oy = ZONES.OCEAN.y;
        var oh = ZONES.OCEAN.h;

        if (assets.ocean1 && assets.ocean2) {
            // Enable smoothing for artwork
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // Cross-fade: ocean 1 always full, ocean 2 fades in/out on top
            var shimmer = Math.sin(t * 1.5) * 0.5 + 0.5;

            ctx.drawImage(assets.ocean1, 0, oy, W, oh);
            ctx.globalAlpha = shimmer;
            ctx.drawImage(assets.ocean2, 0, oy, W, oh);
            ctx.globalAlpha = 1;

            // Restore no-smoothing for pixel art sprites
            ctx.imageSmoothingEnabled = false;

        } else {
            // Fallback: procedural gradient ocean
            var grad = ctx.createLinearGradient(0, oy, 0, oy + oh);
            grad.addColorStop(0, '#0a1628');
            grad.addColorStop(0.3, '#1a3a3a');
            grad.addColorStop(0.7, '#1e4848');
            grad.addColorStop(1, '#2a5858');
            ctx.fillStyle = grad;
            ctx.fillRect(0, oy, W, oh);

            for (var band = 0; band < 6; band++) {
                var bandDepth = (band + 1) / 7;
                var bandY = oy + oh * bandDepth;
                var amplitude = 1 + bandDepth * 4;
                var freq = 0.025 + bandDepth * 0.01;
                var speed = t * (0.6 + band * 0.15);
                ctx.globalAlpha = 0.06 + bandDepth * 0.12;
                ctx.fillStyle = '#5a8a9a';
                ctx.beginPath();
                ctx.moveTo(-10, bandY + amplitude + 4);
                for (var x = -10; x <= W + 10; x += 2) {
                    ctx.lineTo(x, bandY + Math.sin(x * freq - speed) * amplitude);
                }
                ctx.lineTo(W + 10, bandY + amplitude + 4);
                ctx.closePath();
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
    }
